<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/59b162e155.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
</head>

<body>
    <div class="container">
        <main class="product">
            <section class="product-card">
                <div class="skeleton skeleton-img"></div>
                <div class="card-content card-img hidde">
                    <img class="img" src="./public/img/article-img.png" alt="Product image" title="MacBook Air" id="image">
                </div>
            </section>
            <section class="card-information">
                <div class="skeleton skeleton-title"></div>
                <p class="card-content card-title hidde" id="title">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit, voluptas voluptate quod debitis enim
                    quasi.
                </p>
                <div class="card-statistics">
                    <div class="skeleton skeleton-category"></div>
                    <p class="card-content card-category hidde" id="category">Categoria del producto</p>
                    <div class="skeleton skeleton-rate"></div>
                    <div class="card-content card-rate hidde">
                        <i class="fa-solid fa-star icon"></i>
                        <p id="rate">0.0</p>
                        <span class="count" id="count">(0000)</span>
                    </div>
                </div>
                <div class="skeleton skeleton-description"></div>
                <p class="card-content card-description hidde" id="description">Descricion del producto</p>
                <div class="skeleton skeleton-price"></div>
                <p class="card-content card-price hidde" id="price">0</p>
                <div class="skeleton skeleton-btn"></div>
                <div class="card-content card-buttons hidde">
                    <a href="#" class="btn btn--buy-now">Buy Now</a>
                    <a href="#" class="btn btn--add-card">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </a>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
