<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/59b162e155.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="product">
        <section class="product-card">
            <div class="card-img">
                <img src="./public/img/article-img.png" alt="Product image" title="MacBook Air">
            </div>
        </section>
        <section class="card-information">
            <p class="card-title">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit, voluptas voluptate quod debitis enim
                quasi.
            </p>
            <span class="card-rate"><i class="fa-solid fa-star"></i>4.9</span>
            <span class="card-price">$00,000.00</span>
            <div class="card-buttons">
                <a href="#" class="buy_now-button">Buy Now</a>
                <a href="#" class="add_card-button">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
            </div>
        </section>
    </main>
</body>

</html>
